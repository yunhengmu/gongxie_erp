# ==========================================================================================
# BizBuddy 前端站点 + 反向代理（挂载到 nginx 的 /etc/nginx/conf.d/default.conf）
#
# 前端生产构建（pnpm build:prod）使用：
#   VITE_APP_BASE_API = /prod-api      → 由本文件代理到后端 ruoyi-admin:8080
#   VITE_APP_SNAILJOB_ADMIN = /snail-job → 由本文件代理到调度控制台
#
# 关键点：对话与统一消息推送都是 SSE（长连接、逐块下发），
#   故 /prod-api/ 必须关闭响应缓冲（proxy_buffering off）并把读超时放长，否则回答会被攒着不出。
# ==========================================================================================

upstream bizbuddy-api {
    server ruoyi-admin:8080;
    keepalive 32;
}

upstream bizbuddy-snailjob {
    server snailjob-server:8800;
}

server {
    listen       80;
    server_name  _;

    charset       utf-8;
    server_tokens off;

    # 静态资源压缩产物（VITE_BUILD_COMPRESS=gzip 会生成 .gz），存在则优先使用
    gzip_static on;
    gzip         on;
    gzip_min_length 1k;
    gzip_types   text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 文件上传（知识库文档等）
    client_max_body_size 100m;

    # 屏蔽 actuator 等内网探测路径
    location ~ ^(/[^/]*)?/actuator.*(/.*)?$ {
        return 403;
    }

    # ---------------------------------------------------------------- 前端静态资源
    location / {
        root      /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index     index.html index.htm;
    }

    # ---------------------------------------------------------------- 后端接口（含 SSE）
    location /prod-api/ {
        proxy_pass http://bizbuddy-api/;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / WebSocket：HTTP/1.1 + 关闭缓冲 + 长读超时
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---------------------------------------------------------------- 调度控制台
    location /snail-job/ {
        proxy_pass http://bizbuddy-snailjob/snail-job/;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
    }
}
