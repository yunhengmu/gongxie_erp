# ==========================================================================================
# BizBuddy 全栈一键部署（PostgreSQL 版）
#
# 组件：PostgreSQL 14 + Redis + Milvus（standalone：etcd + 复用平台 MinIO 作对象存储）
#       + ruoyi-admin（后端） + nginx（前端 + 反向代理）
#
# 与 `code/back-end/script/docker/docker-compose.yml`（上游模板，MySQL 且无 Milvus）的区别：
#   本文件针对**本项目的真实技术栈**（PostgreSQL 14 + Milvus），并把建库脚本按依赖顺序挂进
#   PostgreSQL 的初始化目录，因此 `docker compose up -d` 后即是「有表、有数据、可登录」的可用环境。
#
# ------------------------------------------------------------------------------------------
# 使用步骤（首次）
#
#   1) 构建后端 jar（Dockerfile 从 target/ 取 jar，故需先在宿主机构建）：
#        cd code/back-end
#        ./mvnw clean package -DskipTests          # Windows: .\mvnw.cmd clean package -DskipTests
#
#   2) 构建前端静态资源（由 nginx 直接托管 dist）：
#        cd code/front-end
#        pnpm install && pnpm build:prod
#
#   3) 启动（本目录）：
#        cd deploy/deploy-pg
#        docker compose up -d --build
#
#   4) 访问：
#        前端         http://localhost/            （端口可用 WEB_PORT 覆盖）
#        后端接口文档  http://localhost:8080/swagger-ui.html
#        初始账号      admin / admin123            （另：test / 666666、test1 / 666666）
#
# ------------------------------------------------------------------------------------------
# 两个必须知道的点
#
#   【1】首次启动后必须补齐模型密钥，否则 AI 对话不可用
#        建库脚本**已预置四个示例模型**（阿里云百炼 / DashScope，`api_key` 一律留空），
#        请登录后到「模型配置」把模型密钥换成自己的（或另行新建模型）；
#        内置智能体的模型槽位**已指向**对话模型，知识库检索用其中的 embedding 模型。
#
#   【2】建库脚本只在**数据卷为空**时执行
#        想重建数据库：docker compose down -v && docker compose up -d --build
#
# 可覆盖的变量见 `.env.example`（复制为 `.env` 即可生效；不配则用文件内默认值）。
# 例外：密钥 / 口令类若沿用出厂默认值，启动自检会拒绝启动（见 x-java-env 的 BIZBUDDY_SECURITY_GUARD_MODE）。
# ==========================================================================================

name: bizbuddy

# 后端应用的基础环境
x-java-env: &java-env
  TZ: ${TZ:-Asia/Shanghai}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  # 出厂默认值收口自检（ProductionConfigGuard）：默认 enforce，命中出厂示例口令 / 密钥即拒绝启动
  # （对全部 profile 生效——默认部署走 dev，若只认 prod 就恰好落在盲区）。
  # 本地开发要沿用出厂值，就在 .env 里把下面这项设为 warn（仅非 prod 生效；prod 下恒为 enforce）。
  BIZBUDDY_SECURITY_GUARD_MODE: ${BIZBUDDY_SECURITY_GUARD_MODE:-enforce}
  POSTGRES_HOST: postgres
  POSTGRES_PORT_INNER: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-biz_buddy}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Zl@2026}
  REDIS_HOST: redis
  REDIS_PORT_INNER: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-Zl@2026}
  MILVUS_HOST: milvus
  MILVUS_USERNAME: ${MILVUS_USERNAME:-root}
  MILVUS_PASSWORD: ${MILVUS_PASSWORD:-Milvus}

services:

  # ------------------------------------------------------------------ 基础设施
  postgres:
    image: postgres:14
    container_name: bizbuddy-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-biz_buddy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Zl@2026}
      # 建库脚本以 UTF-8 导入（脚本内含中文种子数据）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 初始化脚本按**文件名排序**执行，故用数字前缀保证依赖顺序：
      # 框架与系统管理（含 sys_user 初始账号）→ 工作流 → BizBuddy AI
      #
      - ../../code/back-end/script/sql/postgres/postgres_ry_vue.sql:/docker-entrypoint-initdb.d/10-framework-system.sql:ro
      - ../../code/back-end/script/sql/postgres/postgres_ry_workflow.sql:/docker-entrypoint-initdb.d/20-workflow.sql:ro
      - ../../code/back-end/script/sql/postgres/postgres_ry_ai.sql:/docker-entrypoint-initdb.d/40-bizbuddy-ai.sql:ro
      # 5 号脚本（最后执行）：把 sys_oss_config 的端点从 127.0.0.1 改为容器服务名 minio:9000
      - ./sql/50-oss-endpoint.sql:/docker-entrypoint-initdb.d/50-oss-endpoint.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-biz_buddy}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: bizbuddy-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    # 后端 dev 配置要求必须设置密码，故此处也强制 requirepass
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-Zl@2026}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-Zl@2026} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 平台自用的对象存储（OSS）：RuoYi 的文件上传与知识库文档都存这里（配置在 sys_oss_config 表）。
  # Milvus 复用同一实例（独立桶 milvus-bucket），不再单独起 milvus-minio 容器——
  # 两者本就用同一镜像，合并省一个容器与一份数据卷；代价是故障域合并（见 README 重启/运维说明）。
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    container_name: bizbuddy-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${OSS_ACCESS_KEY:-ruoyi}
      MINIO_ROOT_PASSWORD: ${OSS_SECRET_KEY:-ruoyi123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    command: minio server /data --console-address ":9001"
    # Milvus 的 depends_on 要求本实例 healthy（原先这条只在独立的 milvus-minio 上有）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5

  # 一次性初始化：建桶（保持私有，对应 sys_oss_config.access_policy=0）。
  # 私有桶下匿名直访一律 403，文件访问改由后端按需下发预签名 URL（见 SysOssServiceImpl）。
  # 复用 minio 镜像本身——它自带 mc 与 sh，故无需额外镜像
  # （minio/mc 在部分镜像源上取不到：403 Forbidden）。
  minio-init:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    container_name: bizbuddy-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 ${OSS_ACCESS_KEY:-ruoyi} ${OSS_SECRET_KEY:-ruoyi123} >/dev/null 2>&1; do
          echo "等待 MinIO 就绪..."; sleep 2;
        done
        mc mb -p local/${OSS_BUCKET:-ruoyi} || true
        # 私有桶：显式清除匿名读权限。新桶本就是私有；存量卷若曾被设为可公开读，这里会纠正。
        mc anonymous set none local/${OSS_BUCKET:-ruoyi} || true
        # Milvus 的向量数据桶：与平台文件分桶存放，便于各自备份 / 清理而互不影响
        mc mb -p local/milvus-bucket || true
        mc anonymous set none local/milvus-bucket || true
        # 把演示文档送进桶：对应建库脚本里 ai_document「BizBuddy简介.txt」的 oss_id（key=demo/bizbuddy_intro.txt），
        # 使「重新解析」可按对象键读取；重复 up 覆盖同名对象，天然幂等。
        mc cp /seed/bizbuddy_intro.txt local/${OSS_BUCKET:-ruoyi}/demo/bizbuddy_intro.txt || true
        echo "MinIO 桶已就绪：${OSS_BUCKET:-ruoyi}"
    volumes:
      - ../../docs/BizBuddy简介.txt:/seed/bizbuddy_intro.txt:ro
    restart: "no"

  # Milvus standalone 依赖 etcd（元数据）与对象存储，三者构成一个整体。
  # 对象存储**复用平台的 minio**（独立桶 milvus-bucket），不再单独起容器；仅对外暴露 19530（gRPC），
  # etcd 不发布端口，避免与宿主机上可能已有的 etcd 冲突。
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: bizbuddy-milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5

  milvus:
    # 项目文档标注 Milvus v2.6.13；若该镜像在你的网络下拉取不到，可退回 v2.6.12
    image: milvusdb/milvus:v2.6.13
    container_name: bizbuddy-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: milvus-etcd:2379
      # 对象存储复用平台 minio：地址与凭据必须与平台侧一致（原先是独立的 milvus-minio / minioadmin）
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${OSS_ACCESS_KEY:-ruoyi}
      MINIO_SECRET_ACCESS_KEY: ${OSS_SECRET_KEY:-ruoyi123}
      # 独立桶：与平台文件桶分开，便于各自备份 / 清理
      MINIO_BUCKET_NAME: milvus-bucket
      # 与后端配置一致：默认超级用户 root / Milvus
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${MILVUS_PASSWORD:-Milvus}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 120s
      timeout: 20s
      retries: 10

  # ------------------------------------------------------------------ 应用
  ruoyi-admin:
    build:
      # 同上：上下文必须是模块目录，jar 由 `./target/ruoyi-admin.jar` 取用
      context: ../../code/back-end/ruoyi-admin
      dockerfile: Dockerfile
    container_name: bizbuddy-admin
    # 应用容器的启动会因配置不合格而 fail-fast（如配置收口护栏命中出厂值），这类失败重试无用；
    # on-failure:3 让它重试 3 次后停下，避免无限崩溃重启刷日志（基础设施仍用 unless-stopped 自愈）。
    restart: on-failure:3
    environment:
      <<: *java-env
      SERVER_PORT: "8080"
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # 仅覆盖「连接坐标」，其余属性仍取自 jar 内 classpath 的 application-dev.yml。
      # 外置 config/ 目录的优先级高于 jar 内配置，故无需改动源码或重新打包。
      - ./config/application-dev.yml:/ruoyi/server/config/application-dev.yml:ro
      - admin-logs:/ruoyi/server/logs
      # AgentScope 工作区（记忆 / AGENTS.md / 技能产出）默认落在 jar 运行目录的 ./data 下
      - admin-data:/ruoyi/server/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: bizbuddy-web
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端静态资源：需先执行 pnpm build:prod
      - ../../code/front-end/dist:/usr/share/nginx/html:ro
    depends_on:
      ruoyi-admin:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
  milvus-etcd-data:
  milvus-data:
  admin-logs:
  admin-data:
