      html += '        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">';
      html += '          <circle cx="12" cy="5" r="1.5"/>';
      html += '          <circle cx="12" cy="12" r="1.5"/>';
      html += '          <circle cx="12" cy="19" r="1.5"/>';
      html += '        </svg>';
      html += '      </button>';
      html += '    </div>';
      html += '  </div>';
      html += '</div>';
    });
    cardGrid.innerHTML = html;
  }

  renderCards();

  // ========== SIDEBAR INTERACTIONS ==========
  var navSections = document.querySelectorAll('.nav-section-header');
  navSections.forEach(function(header) {
    header.addEventListener('click', function() {
      var section = this.parentElement;
      section.classList.toggle('expanded');
    });
  });

  // Nav item click
  var navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(function(item) {
    item.addEventListener('click', function() {
      var parent = this.parentElement;
      var siblings = parent.querySelectorAll('.nav-item');
      siblings.forEach(function(s) { s.classList.remove('active'); });
      this.classList.add('active');
    });
  });

  // Card click
  cardGrid.addEventListener('click', function(e) {
    var card = e.target.closest('.card');
    if (card) {
      if (e.target.closest('.card-action-btn')) {
        return; // Don't trigger card click on action buttons
      }
      var title = card.querySelector('.card-title').textContent;
      console.log('Open dashboard:', title);
    }
  });

  // Collapse button
  var collapseBtn = document.querySelector('.collapse-btn');
  var sidebar = document.querySelector('.sidebar');
  collapseBtn.addEventListener('click', function() {
    sidebar.classList.toggle('collapsed');
    if (sidebar.classList.contains('collapsed')) {
      sidebar.style.width = '60px';
    } else {
      sidebar.style.width = '';
    }
  });

  console.log('Dashboard replica ready - ' + dashboards.length + ' cards rendered');
})();
</script>

</body>
</html>
