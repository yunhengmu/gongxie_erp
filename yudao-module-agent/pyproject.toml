[project]
name = "my-agents"
version = "0.2.0"
description = "生产级多 Agent 服务（FastAPI + LangChain + LangGraph）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain[deepseek,community]>=1.3.14",
    "langgraph>=1.2.10",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "jieba>=0.42.1",
    "duckduckgo-search>=7.0.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
rag = [
    "fastembed>=0.5.0",
    "langchain-chroma>=0.2.0",
    "pymilvus>=2.4.0",
    "langchain-milvus>=0.1.0",
]
postgres = [
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg>=3.2.0",
]
search = [
    "tavily-python>=0.5.0",
]
documents = [
    "pdfplumber>=0.11.0",
    "python-docx>=1.0.0",
    "python-pptx>=1.0.0",
    "paddleocr>=2.9.0",
    "paddlepaddle>=3.0.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
]
redis = [
    "redis>=5.0.0",
]
evaluate = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]
classify = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
]
retrieval = [
    "rank-bm25>=0.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "my-agents[rag]",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
]
